<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ext-resource-dependency" content="assets/arivoo-logo.png" data-resource-id="logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:#fbfaf7;color:#14151a;-webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:inherit;text-decoration:none}
  a:hover{color:#0e5a96}
  h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.05;letter-spacing:-0.02em}
  ::selection{background:#126FB8;color:#fff}
</style>
</helmet>

<div style="min-height:100vh;background:radial-gradient(120% 90% at 50% -10%, #eef2f6 0%, #fbfaf7 55%);display:flex;flex-direction:column">
  <div style="max-width:1160px;width:100%;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between">
    <a href="Arivoo%20Home.dc.html" style="display:flex;align-items:center"><img src="assets/arivoo-logo-powered.png" alt="arivoo" style="height:40px;width:auto;display:block"></a>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:8px 24px 24px">
    <div style="width:min(600px,100%);background:#fff;border:1px solid #eceae4;border-radius:28px;box-shadow:0 40px 100px -30px rgba(20,21,26,.28);padding:32px 44px 28px">

      <sc-if value="{{ notSubmitted }}" hint-placeholder-val="{{ true }}">
        <div>
          <div style="font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#126FB8">Book a demo</div>
          <h1 style="font-size:30px;font-weight:700;margin-top:8px;max-width:360px;text-wrap:balance">Get a 30-min demo with our team</h1>
        </div>

        <div style="margin-top:20px">
          <label style="font-size:13px;font-weight:700;color:#3a3d47">Full name</label>
          <input type="text" placeholder="Your name" style="width:100%;margin-top:6px;background:#f6f5f1;border:1.5px solid #ece9e1;border-radius:13px;padding:11px 16px;font:inherit;font-size:15px;color:#14151a;outline:none;transition:border-color .18s,background .18s" style-focus="border-color:#126FB8;background:#fff">
        </div>

        <div style="margin-top:14px">
          <label style="font-size:13px;font-weight:700;color:#3a3d47">Work email</label>
          <input type="email" placeholder="name@institution.edu" style="width:100%;margin-top:6px;background:#f6f5f1;border:1.5px solid #ece9e1;border-radius:13px;padding:11px 16px;font:inherit;font-size:15px;color:#14151a;outline:none;transition:border-color .18s,background .18s" style-focus="border-color:#126FB8;background:#fff">
        </div>

        <div style="margin-top:14px">
          <label style="font-size:13px;font-weight:700;color:#3a3d47">Phone number</label>
          <input type="tel" placeholder="+91 98765 43210" style="width:100%;margin-top:6px;background:#f6f5f1;border:1.5px solid #ece9e1;border-radius:13px;padding:11px 16px;font:inherit;font-size:15px;color:#14151a;outline:none;transition:border-color .18s,background .18s" style-focus="border-color:#126FB8;background:#fff">
        </div>

        <div style="margin-top:16px">
          <div style="font-size:13px;font-weight:700;color:#3a3d47">Which product(s) are you interested in? <span style="color:#126FB8">*</span></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
            <sc-for list="{{ demoProductCards }}" as="p" hint-placeholder-count="4">
              <button type="button" onClick="{{ p.toggle }}" style="{{ p.cardStyle }}">
                <span style="{{ p.checkStyle }}">{{ p.check }}</span>
                <span style="font-size:14.5px;font-weight:700;color:#14151a">{{ p.name }}</span>
                <span style="font-size:12px;color:#8a8e99;font-weight:500">{{ p.tag }}</span>
              </button>
            </sc-for>
          </div>
        </div>

        <button type="button" onClick="{{ submit }}" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px;background:#126FB8;color:#fff;font-weight:600;font-size:16px;padding:13px;border-radius:14px;border:none;cursor:pointer;box-shadow:0 12px 28px rgba(18,111,184,.28);transition:transform .2s,background .2s" style-hover="background:#0c5896;transform:translateY(-2px)">Submit <span>→</span></button>
        <p style="text-align:center;font-size:13.5px;color:#9a9ea9;font-weight:500;margin-top:12px">1000+ institutions booked a demo last year</p>
      </sc-if>

      <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center;padding:14px 0 6px">
          <span style="width:64px;height:64px;border-radius:50%;background:#e4f0f9;color:#126FB8;display:grid;place-items:center;margin:0 auto;font-size:30px">✓</span>
          <h1 style="font-size:30px;font-weight:700;margin-top:22px">You're all set</h1>
          <p style="font-size:16px;color:#5b5f6b;margin-top:12px;max-width:380px;margin-inline:auto;text-wrap:pretty">Thanks — our team will reach out shortly to confirm a time that works for you.</p>
          <p style="font-size:15px;color:#8a8e99;font-weight:600;margin-top:26px">Redirecting you to the website in <span style="color:#126FB8;font-weight:800">{{ countdown }}</span>…</p>
        </div>
      </sc-if>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { products:[], done:false, countdown:5 };
  componentDidMount(){ this._applyImgs(); }
  _startCountdown(){
    if(this._timer) return;
    this._timer=setInterval(()=>{
      this.setState(s=>{
        const n=(s.countdown||0)-1;
        if(n<=0){ clearInterval(this._timer); this._timer=null; try{ window.location.href='Arivoo%20Home.dc.html'; }catch(e){} return {countdown:0}; }
        return {countdown:n};
      });
    },1000);
  }
  componentWillUnmount(){ if(this._timer){ clearInterval(this._timer); this._timer=null; } }
  _applyImgs(){ try{ document.querySelectorAll('img[data-src]').forEach(el=>{ const v=el.getAttribute('data-src'); if(v && el.getAttribute('src')!==v) el.setAttribute('src', v); }); }catch(e){} }
  toggle(k){ this.setState(s=>{ const c=s.products||[]; return {products: c.indexOf(k)>-1 ? c.filter(x=>x!==k) : c.concat(k)}; }); }
  renderVals(){
    const defs=[
      {key:'UMS', name:'University Management', tag:'Universities & colleges'},
      {key:'SMS', name:'School Management', tag:'K\u2013\u2009schools'},
      {key:'LMS', name:'Learning Management', tag:'Courses & training'},
      {key:'TestGUARD', name:'TestGUARD', tag:'Online proctoring'},
    ];
    defs[1].tag='K\u201312 schools';
    const sel=this.state.products||[];
    const demoProductCards=defs.map(p=>{
      const on=sel.indexOf(p.key)>-1;
      return {
        name:p.name, tag:p.tag, check:on?'\u2713':'', toggle:()=>this.toggle(p.key),
        cardStyle:'text-align:left;cursor:pointer;border-radius:14px;padding:11px 14px;border:1.5px solid '+(on?'#126FB8':'#e5e3dc')+';background:'+(on?'#eef6fc':'#fbfaf7')+';transition:border-color .18s,background .18s;position:relative;display:flex;flex-direction:column;gap:2px',
        checkStyle:'position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;border:1.5px solid '+(on?'#126FB8':'#cfd3db')+';background:'+(on?'#126FB8':'transparent')+';color:#fff',
      };
    });
    return {
      demoProductCards,
      countdown: this.state.countdown,
      notSubmitted: !this.state.done,
      submitted: !!this.state.done,
      submit: ()=>{ this.setState({done:true}); this._startCountdown(); },
    };
  }
}
</script>
<script src="./chatbot-widget.js"></script>
</body>
</html>
